<script>
'use strict';
/* ================= 配置 ================= */
const W=480, H=854, GROUND=720, GRAV=2200;
const MULT=[1,1.2,1.5,2,3,5];          // 连击倍率
const COMBO_WINDOW=3;                  // 连击窗口（秒）
const PASS_RATE=0.6;                   // 通关所需砸碎率
const VERSION='1.2';                   // M6 手机体验优化

/* ================= 工具 ================= */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }
function shade(hex,f){ // f>0 变亮 f<0 变暗
  const n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const t=f>0?255:0, k=Math.abs(f);
  const m=c=>Math.round(c+(t-c)*k);
  return 'rgb('+m(r)+','+m(g)+','+m(b)+')';
}
function polyPath(c,pts){ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]); c.closePath(); }
function roundRect(c,x,y,w,h,r){
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

/* ================= M7 UI 设计系统：霓虹破碎夜场（深紫底 + 金奖赏 + 珊瑚行动） ================= */
const UI={
  bg0:'#20193a', bg1:'#090b1a', bg2:'#120f28',
  card:'#292348', card2:'#181633', cardHi:'#39305f',
  line:'rgba(178,151,255,0.22)', neon:'#a98cff', cyan:'#67e8f9',
  gold:'#ffd166', goldD:'#c9971f',
  coral:'#ff7a59', green:'#7ee081', blue:'#9fd8ef',
  ink:'#0e0b1e', sub:'rgba(244,241,255,0.72)', dim:'rgba(218,208,255,0.45)',
};
function uiCard(c,r,opt){   // 通用卡片：深色玻璃 + 霓虹切角 + 顶部高光（opt:{fill,fill2,line,gold,flat,r}）
  opt=opt||{};
  const g=c.createLinearGradient(0,r.y,0,r.y+r.h);
  g.addColorStop(0,opt.fill||UI.cardHi); g.addColorStop(0.16,opt.fill||UI.card); g.addColorStop(1,opt.fill2||opt.fill||UI.card2);
  c.fillStyle=g; c.beginPath(); roundRect(c,r.x,r.y,r.w,r.h,opt.r||18); c.fill();
  c.strokeStyle=opt.line||(opt.gold?'rgba(255,209,102,0.72)':UI.line); c.lineWidth=opt.gold?2.5:1.5; c.stroke();
  if(!opt.flat){
    const hg=c.createLinearGradient(0,r.y,0,r.y+r.h*0.4);
    hg.addColorStop(0,'rgba(255,255,255,0.12)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=hg; c.beginPath(); roundRect(c,r.x,r.y,r.w,r.h,opt.r||18); c.fill();
    c.strokeStyle=opt.gold?UI.gold:UI.neon; c.globalAlpha=0.72; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(r.x+10,r.y+8); c.lineTo(r.x+30,r.y+8); c.moveTo(r.x+8,r.y+10); c.lineTo(r.x+8,r.y+24);
    c.moveTo(r.x+r.w-10,r.y+r.h-8); c.lineTo(r.x+r.w-30,r.y+r.h-8); c.moveTo(r.x+r.w-8,r.y+r.h-10); c.lineTo(r.x+r.w-8,r.y+r.h-24); c.stroke();
    c.globalAlpha=1;
  }
}

/* ================= 音频引擎（WebAudio 程序合成） ================= */
const AU={
  ctx:null, master:null, noise:null, primed:false,
  init(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx=new AC();
    const comp=this.ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=20; comp.ratio.value=8;
    this.master=this.ctx.createGain(); this.master.gain.value=0.7;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    const len=this.ctx.sampleRate|0;
    this.noise=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=this.noise.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    applyAudio();                    // M5：按存档设置应用音量/静音
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
  unlock(){ // 必须在用户手势内调用：创建/恢复 AudioContext + 播放静音脉冲"预热"
    this.init();
    if(!this.ctx) return;
    const wasSuspended=this.ctx.state==='suspended';
    if(wasSuspended) this.resume();
    if(!this.primed||wasSuspended){  // 微信 iOS 会反复挂起，每次从挂起恢复都要重新"预热"一次
      this.primed=true;
      const t=this.ctx.currentTime, s=this.ctx.createBufferSource();
      s.buffer=this.noise;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.004,t);      // 极低音量（几乎不可闻），让 iOS/微信认可音频会话
      g.gain.exponentialRampToValueAtTime(0.004,t+0.06);
      s.connect(g); g.connect(this.master);
      s.start(t,0,0.06);
    }
    if(G.debugAudio) console.log('[audio] 解锁后状态:', this.ctx.state);
  },
  t(){ return this.ctx?this.ctx.currentTime:0; },
  tone(type,f0,f1,dur,vol,when,atk){
    if(!this.ctx) return;
    const t=(when||this.t())+0.001, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(f0,1),t);
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    const a=atk||0.005;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },
  burst(dur,type,f0,f1,vol,when,q){
    if(!this.ctx) return;
    const t=(when||this.t())+0.001, s=this.ctx.createBufferSource();
    s.buffer=this.noise; s.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type=type; f.Q.value=q||1;
    f.frequency.setValueAtTime(Math.max(f0,1),t);
    if(f1) f.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+dur+0.05);
  },
  /* —— 具体音效配方（参数每次 ±15% 随机防重复） —— */
  whoosh(k){ // 投掷嗖声：噪声带通扫频
    this.burst(0.12+0.06*k,'bandpass',rnd(320,480),rnd(1200,1800),0.05+0.06*k,0,2);
  },
  shatter(mat){
    if(mat==='glass'){ // 玻璃：高频“叮”群 + 高频噪声簇
      const now=this.t();
      for(let i=0;i<6;i++){
        const f=rnd(2200,5800), w=now+rnd(0,0.04);
        this.tone('sine',f,f*rnd(0.6,0.9),rnd(0.04,0.09),rnd(0.05,0.11),w);
      }
      this.burst(0.09,'highpass',3000,0,0.12,now);
    }else if(mat==='ceramic'){ // 瓷器：中频叮 + 低频“咚”
      const now=this.t();
      for(let i=0;i<4;i++){
        const f=rnd(1100,2700);
        this.tone('sine',f,f*rnd(0.5,0.8),rnd(0.1,0.18),rnd(0.06,0.12),now+rnd(0,0.05));
      }
      this.burst(0.22,'lowpass',2500,0,0.14,now);
      this.tone('sine',90,60,0.18,0.2,now);
    }else if(mat==='wood'){ // 木头：锯齿波降频断裂
      const now=this.t();
      this.tone('sawtooth',rnd(160,200),90,0.12,0.14,now);
      this.tone('sawtooth',rnd(120,150),70,0.14,0.1,now+0.02);
      this.burst(0.12,'lowpass',800,0,0.12,now);
    }else if(mat==='paper'){ // 纸张：翻页沙沙声 + 高频簌簌
      const now=this.t();
      this.burst(0.25,'bandpass',900,300,0.16,now,1.5);
      for(let i=0;i<4;i++) this.burst(0.05,'highpass',rnd(1800,3200),0,0.06,now+rnd(0,0.12));
    }else if(mat==='metal'){ // 金属：非谐泛音"哐"（奖杯碎裂）
      const now=this.t();
      [520,780,1160,1530].forEach(f=>this.tone('sawtooth',f*rnd(0.92,1.06),f*0.98,rnd(0.12,0.2),rnd(0.07,0.11),now+rnd(0,0.02)));
      this.tone('square',180,140,0.12,0.15,now);
      this.burst(0.08,'highpass',2500,0,0.08,now);
    }else{ // 电子：玻璃+塑料混合
      const now=this.t();
      for(let i=0;i<5;i++){
        const f=rnd(1500,4500);
        this.tone('square',f,f*0.7,rnd(0.04,0.08),rnd(0.04,0.08),now+rnd(0,0.05));
      }
      this.burst(0.15,'highpass',2000,0,0.12,now);
      this.tone('sine',200,60,0.2,0.15,now);
    }
  },
  thud(k){ // 重物砸地“砰”：正弦快速降频 + 噪声瞬态
    if(!this.ctx) return;
    const now=this.t();
    this.tone('sine',rnd(130,170),38,0.22,0.5*k,now,0.003);
    this.burst(0.04,'lowpass',900,0,0.2*k,now);
    this.tone('sine',80,45,0.35,0.18*k,now+0.02);
  },
  tick(b){ // 碎片落地弹跳：音量随弹跳递减
    this.burst(rnd(0.012,0.03),'highpass',2500,0,0.1*Math.pow(0.6,b),0,1);
  },
  crack(){ // 裂纹“咔”
    const now=this.t();
    this.tone('square',rnd(260,340),220,0.045,0.1,now,0.002);
    this.burst(0.03,'bandpass',rnd(500,900),0,0.08,now,3);
  },
  ui(){ // 界面点击短音
    this.tone('sine',700,520,0.06,0.08);
  },
  combo(level){ // 连击提示：三角波琶音
    const now=this.t(), f0=523*Math.pow(1.06,Math.min(level,8));
    [0,4,7].forEach((st,i)=>this.tone('triangle',f0*Math.pow(2,st/12),0,0.07,0.1,now+i*0.055));
  },
  fanfare(){ // 通关号角
    const now=this.t();
    [523,659,784,1047].forEach((f,i)=>this.tone('triangle',f,0,0.18,0.14,now+i*0.09));
    this.burst(0.3,'highpass',4000,0,0.05,now+0.36);
  },
  redeem(){ // 兑换成功：上行音阶 + 铃铛
    const now=this.t();
    [392,523,659,784].forEach((f,i)=>this.tone('triangle',f,0,0.12,0.11,now+i*0.07));
    this.tone('sine',1568,0,0.35,0.09,now+0.32);
    this.tone('sine',2093,0,0.45,0.07,now+0.46);
  },
  dingcluster(){ // 大镜子碎裂：玻璃"叮当"群 + 长余韵（M4）
    if(!this.ctx) return;
    const now=this.t();
    for(let i=0;i<9;i++){
      const f=rnd(1800,6500), w=now+rnd(0,0.09);
      this.tone('sine',f,f*rnd(0.55,0.75),rnd(0.08,0.16),rnd(0.05,0.1),w);
    }
    this.burst(0.3,'highpass',2600,0,0.1,now);
    this.burst(0.4,'bandpass',rnd(1200,2000),rnd(500,900),0.06,now+0.05,2);
  },
  metalClang(k){ // 保险箱金属撞击：短促"哐"（M4）
    if(!this.ctx) return;
    const now=this.t();
    [420,640,900].forEach((f,i)=>this.tone('triangle',f*rnd(0.92,1.08),f*0.96,rnd(0.08,0.14),0.1*(k||1),now+i*0.006));
    this.burst(0.05,'bandpass',rnd(1800,2800),0,0.08*(k||1),now,2);
  },
};

/* ================= 存档（localStorage）+ 等级称号 ================= */
const SAVE_KEY=new URLSearchParams(location.search).get('preview')==='1'?'zmt_preview_throw_v1':'zmt_save_v1';
const padArr=(a,n)=>(a&&Array.isArray(a)?a.slice(0,n).concat(new Array(Math.max(0,n-a.length)).fill(0)):new Array(n).fill(0));
const saveNumber=(v,fallback=0)=>typeof v==='number'&&Number.isFinite(v)?Math.max(0,Math.min(v,Number.MAX_SAFE_INTEGER)):fallback;
const Save={
  data:{score:0, stars:padArr(null,LEVELS.length), best:padArr(null,LEVELS.length), maxCombo:0, gifts:[],
    vol:0.7, vib:true, sfx:true},    // M5：音量/震动/音效设置（旧存档取默认）
  load(){
    try{
      const s=JSON.parse(localStorage.getItem(SAVE_KEY));
      if(s&&typeof s==='object'){ this.data.score=Math.floor(saveNumber(s.score)); this.data.stars=padArr(s.stars,LEVELS.length).map(v=>Math.min(3,Math.floor(saveNumber(v))));
        this.data.best=padArr(s.best,LEVELS.length).map(v=>Math.floor(saveNumber(v))); this.data.maxCombo=Math.floor(saveNumber(s.maxCombo));
        this.data.gifts=Array.isArray(s.gifts)?[...new Set(s.gifts.filter(id=>GIFTS.some(g=>g.id===id)))]:[];
        this.data.vol=Math.min(1,saveNumber(s.vol,0.7));      // 旧存档无设置字段 → 默认
        this.data.vib=s.vib!==false; this.data.sfx=s.sfx!==false; }
    }catch(e){}
  },
  save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(this.data)); return true; }catch(e){ G.toast='保存失败：请检查浏览器存储空间或权限'; G.toastT=4; return false; } },
  addScore(n){ this.data.score+=n; },
  setStars(i,n){ if(n>this.data.stars[i]) this.data.stars[i]=n; },
  unlocked(i){ return i===0||this.data.stars[i-1]>=1; },
  hasGift(id){ return this.data.gifts.indexOf(id)>=0; },
};

function titleInfo(score){  // 累计积分 → 等级 + 称号
  let idx=-1;
  for(let i=0;i<TITLES.length;i++){ if(score>=TITLES[i][0]) idx=i; }
  const t=TITLES[idx];
  return {lv:idx<0?0:t[2], ti:idx<0?'初来乍到':t[1], cur:idx<0?0:t[0], next:TITLES[idx+1]||null};
}

function makeItem(d){
  const t=TYPES[d.t];
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  t.poly.forEach(q=>{ if(q[0]<minX)minX=q[0]; if(q[0]>maxX)maxX=q[0]; if(q[1]<minY)minY=q[1]; if(q[1]>maxY)maxY=q[1]; });
  const w=maxX-minX, h=maxY-minY, pad=t.pad||2;
  let y;
  if(d.s==='floor') y=GROUND-h/2;
  else if(d.s==='wall'||d.s==='drop') y=d.y;   // wall：挂墙上固定 y；drop：发泄屋空中出生
  else { const tb=TABLES[d.s==='table1'?0:1]; y=tb.y-h/2+(d.yoff||0); }
  return { t:d.t, type:t, x:d.x, y, state:'rest', vx:0, vy:0, ang:0, vang:0,
    hp:t.hp, cracks:0, w:w+pad*2, h:h+pad*2, r:Math.max(w,h)/2+pad,
    source:'none', crackLines:[] };
}
function makeItems(){
  return (G.free?[]:LEVELS[G.level].items).map(makeItem);
}
function spawnFree(){  // 发泄屋：随机物品从空中落下（软着陆：不摔碎）
  // 保留保险箱类型，但场内最多一个，避免不可破坏物品堵住刷新。
  const pool=G.items.some(it=>it.state!=='gone'&&it.type.unbreakable)?FREE_POOL.filter(t=>!TYPES[t].unbreakable):FREE_POOL;
  const t=pool[(Math.random()*pool.length)|0];
  const it=makeItem({t, x:rnd(60,W-60), s:'drop', y:-60});
  it.state='fly'; it.vy=0; it.vang=rnd(-3,3); it.soft=true;
  G.items.push(it);
}

function setScreen(s){ G.screen=s; G.screenT=0; G.fade=0.24; }   // 切界面带淡入过渡
function applyAudio(){ if(AU.master) AU.master.gain.value=Save.data.sfx===false?0:(typeof Save.data.vol==='number'?Save.data.vol:0.7); }
function pauseGame(on){
  if(G.screen!=='play') return;
  G.paused=on; G.sliderDrag=false; input.samples=[];
  if(on){
    if(input.held){const it=input.held;it.state='fly';it.vx=0;it.vy=0;it.vang=0;}
    input.active=false;input.held=null;input.id=null;
    if(AU.master) AU.master.gain.value=0;
  }else{last=performance.now();applyAudio();AU.resume();}
}
function vib(p){ if(Save.data.vib&&navigator.vibrate) navigator.vibrate(p); }
function isLandscape(){ return window.innerWidth>window.innerHeight; }

function setVolFromX(x){ Save.data.vol=clamp((x-44)/392,0,1); Save.save(); applyAudio(); }
function confettiBurst(){   // 三星全清彩带雨
  const cols=['#ffd166','#ff7a59','#7ee081','#9fd8ef','#ff9fce'];
  for(let i=0;i<46;i++) G.confetti.push({ x:rnd(60,W-60), y:rnd(-80,120), vx:rnd(-50,50), vy:rnd(80,200), ang:rnd(0,6), vang:rnd(-6,6), t:0, s:rnd(5,9), color:cols[(Math.random()*cols.length)|0] });
}
function updateConfetti(realDt){
  for(const p of G.confetti){ p.t+=realDt; p.x+=p.vx*realDt; p.y+=p.vy*realDt; p.vy+=460*realDt; p.ang+=p.vang*realDt; }
  G.confetti=G.confetti.filter(p=>p.t<1.9);
}
function drawConfetti(c){
  for(const p of G.confetti){
    c.save(); c.translate(p.x,p.y); c.rotate(p.ang);
    c.globalAlpha=clamp(1-p.t/1.9,0,1);
    c.fillStyle=p.color; c.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.62);
    c.restore();
  }
  c.globalAlpha=1;
}

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR; cv.height=H*DPR;

/* ================= 输入（Pointer Events：触屏+鼠标） ================= */
const input={ active:false, id:null, x:0, y:0, samples:[], held:null, offX:0, offY:0 };
function toCanvas(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
function gestureVel(){
  const s=input.samples;
  if(s.length<2) return {x:0,y:0};
  // Pointer 停止移动不会补采样；过期动作不应在松手时变成猛甩。
  if(performance.now()-s[s.length-1].t>120) return {x:0,y:0};
  const a=s[0], b=s[s.length-1], dt=(b.t-a.t)/1000;
  if(dt<=0) return {x:0,y:0};
  return { x:(b.x-a.x)/dt, y:(b.y-a.y)/dt };
}
function inRect(p,r){
  if(!r) return false;
  // 原矩形与画面不移动，向两侧补充小控件的透明点击区。
  const dx=Math.max(0,(44-r.w)/2),dy=Math.max(0,(44-r.h)/2);
  return p.x>=r.x-dx&&p.x<=r.x+r.w+dx&&p.y>=r.y-dy&&p.y<=r.y+r.h+dy;
}
function panelHit(p){ return inRect(p,G.btn1)||inRect(p,G.btn2)||inRect(p,G.btn3); }
cv.addEventListener('pointerdown',e=>{
  if(isLandscape()) return;              // M5：横屏时忽略一切操作
  AU.unlock();
  const p=toCanvas(e);
  if(G.screen==='play'&&G.paused){
    if(inRect(p,G.resumeBtn)){pauseGame(false);AU.ui();}
    else if(inRect(p,G.pauseExitBtn)){showLevelSelect();AU.ui();}
    return;
  }
  if(G.screen==='play'&&!G.panel&&inRect(p,G.pauseBtn)){pauseGame(true);return;}
  if(G.screen==='settings'){             // M5 设置界面：返回/滑杆/开关/重置存档
    if(inRect(p,G.backBtn)){ AU.ui(); showLevelSelect(); return; }
    if(inRect(p,G.volBar)){ AU.ui(); G.sliderDrag=true; setVolFromX(p.x); return; }
    if(inRect(p,G.setSfxTgl)){ AU.ui(); Save.data.sfx=!Save.data.sfx; Save.save(); applyAudio(); return; }
    if(inRect(p,G.setVibTgl)){ AU.ui(); Save.data.vib=!Save.data.vib; Save.save(); vib(20); return; }
    if(inRect(p,G.resetBtn)){
      if(G.resetArm){ AU.ui(); resetAllSave(); }
      else{ AU.ui(); G.resetArm=true; G.resetT=4; G.toast='⚠️ 再点一次「重置」确认清空存档'; G.toastT=2.6; }
      return;
    }
    return;
  }
  if(G.screen==='select'){               // 选关界面：底部导航 + 发泄屋 + 关卡卡片
    const n=G.navBtns.findIndex(r=>inRect(p,r));
    if(n>=0){ AU.ui(); openScreen(['shop','hall','titles','settings'][n]); return; }
    if(inRect(p,G.freeCard)){ AU.ui(); if(freeUnlocked()) startFree(); return; }
    const i=G.cards.findIndex(r=>inRect(p,r));
    if(i>=0){ AU.ui(); if(Save.unlocked(i)) startLevel(i); }
    return;
  }
  if(G.screen==='shop'){                 // 礼品馆：返回 + 点礼品卡兑换
    if(inRect(p,G.backBtn)){ AU.ui(); showLevelSelect(); return; }
    const i=G.giftCards.findIndex(r=>inRect(p,r));
    if(i>=0) tryRedeem(i);
    return;
  }
  if(G.screen==='hall'||G.screen==='titles'){   // 荣誉室 / 称号：仅返回按钮
    if(inRect(p,G.backBtn)){ AU.ui(); showLevelSelect(); }
    return;
  }
  if(G.panel){                           // 结算面板
    if(!panelHit(p)){ G.panel=false; G.passed=false; G.state='play'; G.panelShown=false; return; } // 点外部 = 继续砸场
    AU.ui();
    if(inRect(p,G.btn1)) resetLevel();               // 再砸一次
    else if(inRect(p,G.btn2)) startLevel(G.level+1); // 下一关
    else if(inRect(p,G.btn3)) showLevelSelect();     // 选关
    return;
  }
  if(inRect(p,G.backBtn)){             // M6：二次确认，防误触退出丢进度
    if(G.retArm){ AU.ui(); showLevelSelect(); return; }
    AU.ui(); G.retArm=true; G.retT=3; return;
  }
  G.retArm=false;                      // M6：点其他地方取消退出确认
  if(input.active) return;
  e.preventDefault();
  input.active=true; input.id=e.pointerId; input.x=p.x; input.y=p.y;
  input.samples=[{x:p.x,y:p.y,t:performance.now()}];
  for(let i=G.items.length-1;i>=0;i--){   // 拾取最上层可砸物品
    const it=G.items[i];
    if(it.state==='rest'&&dist2(it.x,it.y,p.x,p.y)<(it.r+10)*(it.r+10)){
      input.held=it; it.state='held'; it.vx=0; it.vy=0;
      input.offX=it.x-p.x; input.offY=it.y-p.y;
      for(const jt of G.items){          // 抽走支撑物：上方堆叠物品失去支撑 → 自然坍塌
        if(jt!==it&&jt.state==='rest'&&jt.y<it.y-4&&Math.abs(jt.x-it.x)<it.r+jt.r){
          jt.state='fly'; jt.vx=rnd(-30,30); jt.vy=0; jt.vang=rnd(-2,2);
        }
      }
      break;
    }
  }
});
window.addEventListener('pointermove',e=>{
  if(G.sliderDrag){ const p=toCanvas(e); setVolFromX(p.x); e.preventDefault(); return; }   // M5：音量滑杆拖动
  if(!input.active||e.pointerId!==input.id) return;
  e.preventDefault();
  const p=toCanvas(e);
  input.x=p.x; input.y=p.y;
  input.samples.push({x:p.x,y:p.y,t:performance.now()});
  if(input.samples.length>6) input.samples.shift();
});
function release(){
  if(!input.active) return;
  input.active=false;
  const it=input.held; input.held=null;
  if(!it||it.state!=='held') return;
  const v=gestureVel(), sp=Math.hypot(v.x,v.y);
  it.state='fly'; it.source='throw';
  if(sp>280){                              // 大力甩出
    it.vx=clamp(v.x*1.15,-1500,1500); it.vy=clamp(v.y*1.15,-1500,1500);
    it.vang=rnd(-10,10); AU.whoosh(Math.min(1,sp/1200));
  }else{                                   // 轻砸：松手落下
    it.vx=rnd(-45,45); it.vy=50; it.vang=rnd(-3,3);
  }
}
window.addEventListener('pointerup',e=>{ if(G.sliderDrag){ G.sliderDrag=false; return; } if(e.pointerId===input.id) release(); });
window.addEventListener('pointercancel',e=>{ if(G.sliderDrag){ G.sliderDrag=false; return; } if(e.pointerId===input.id) release(); });
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());   // M6：旧 iOS Safari 双指缩放拦截
document.addEventListener('dblclick',e=>e.preventDefault());       // M6：桌面双击缩放拦截
document.addEventListener('touchmove',e=>{ if(input.active) e.preventDefault(); },{passive:false});
// 移动端音频解锁兜底：部分安卓/iOS 浏览器只认 touchstart/touchend/click 手势
document.addEventListener('touchstart',()=>AU.unlock(),{passive:true});
document.addEventListener('touchend',()=>AU.unlock(),{passive:true});
document.addEventListener('click',()=>AU.unlock());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(true); else AU.resume(); });
window.addEventListener('blur',()=>pauseGame(true));
window.addEventListener('resize',()=>{if(isLandscape())pauseGame(true)});
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Escape')&&G.screen==='play'&&!isLandscape()){e.preventDefault();pauseGame(!G.paused)}});
// 微信内置浏览器专属：WeixinJSBridge 就绪前 WebAudio 被微信锁死，就绪后必须再解锁一次
if(typeof WeixinJSBridge!=='undefined'){
  try{ WeixinJSBridge.invoke('getNetworkType',{},()=>AU.unlock()); }catch(e){}
}else{

/* ================= 破坏 ================= */
function addCracks(it){
  const n=2+((Math.random()*2)|0), lines=[];
  for(let i=0;i<n;i++){
    let x=rnd(-1,1)*it.w*0.3, y=rnd(-1,1)*it.h*0.3;
    const pts=[[x,y]];
    for(let k=0;k<3;k++){ x+=rnd(-1,1)*it.w*0.28; y+=rnd(-1,1)*it.h*0.28; pts.push([x,y]); }
    lines.push(pts);
  }
  it.crackLines=it.crackLines.concat(lines);
}
function takeDamage(it, source){
  if(it.state==='gone') return;
  if(it.type.unbreakable){                     // 保险箱：砸不碎，金属"哐"弹飞当工具
    AU.metalClang(1);
    G.shakeAmp=Math.max(G.shakeAmp,3);
    if(it.state==='rest'){ it.state='fly'; it.vx=rnd(-260,260); it.vy=-rnd(200,380); it.vang=rnd(-6,6); }
    else { it.vx*=-0.5; it.vy=-Math.abs(it.vy)*0.5; }
    floater('哐！', it.x, it.y-it.h/2-8, false, 0.8);
    return;
  }
  it.source=source||it.source||'throw';
  it.hp--;
  if(it.hp<=0){ smash(it); return; }
  it.cracks++; addCracks(it); AU.crack();
  G.shakeAmp=Math.max(G.shakeAmp,2.5);
  floater('咔！', it.x, it.y-it.h/2-8, false, 0.8);
  if(it.state==='rest'){ it.state='fly'; it.vx=rnd(-140,140); it.vy=-rnd(120,240); it.vang=rnd(-5,5); }
  else { it.vx+=rnd(-80,80); it.vy=Math.min(it.vy,-80); }
}
function smash(it){
  it.state='gone';
  makeFragments(it); makeDust(it);
  if(it.type.reflect) AU.dingcluster();      // 大镜子：叮当群（替代普通玻璃声）
  else AU.shatter(it.type.mat);
  const m=it.type.mass;
  G.freezeT=Math.max(G.freezeT, m>=4?0.12:(m>=1.2?0.07:0.04));   // 顿帧
  G.shakeAmp=Math.max(G.shakeAmp, Math.min(14,m*2));             // 震屏
  vib(Math.round(clamp(30+m*8,30,80)));
  // 连击
  G.combo++; G.comboT=COMBO_WINDOW; G.maxCombo=Math.max(G.maxCombo,G.combo);
  const mult=MULT[Math.min(G.combo,5)];
  const chain=it.source==='chain';
  let pts=Math.round(it.type.score*mult);
  if(chain) pts+=5+Math.round(it.type.score*0.5);
  G.score+=pts;
  floater('+'+pts, it.x, it.y-it.h/2-6, mult>1||chain, clamp(0.8+it.type.mass*0.15,0.8,1.6));
  if(chain) floater('连锁！', it.x, it.y-it.h/2-34, false, 0.7);
  if(G.combo>=2) AU.combo(G.combo);
  if(G.free){                              // 发泄屋：砸碎直接入账总积分（无结算面板）
    Save.addScore(pts);
    Save.data.maxCombo=Math.max(Save.data.maxCombo||0,G.maxCombo);
    Save.save();
  }
  // 统计与慢动作
  G.smashed++;
  const now=performance.now();
  G.breakTimes.push(now);
  while(G.breakTimes.length&&now-G.breakTimes[0]>900) G.breakTimes.shift();
  if(G.breakTimes.length>=3) slowmo(0.35,1.2);                   // 连锁爆发 → 子弹时间
  if(m>=4) slowmo(0.5,0.5);                                      // 大件 → 慢动作
  checkPass();
}
function slowmo(s,d){ G.timeScale=Math.min(G.timeScale,s); G.slowmoT=Math.max(G.slowmoT,d); }
function makeFragments(it){
  const p=it.type.poly, cos=Math.cos(it.ang), sin=Math.sin(it.ang);
  let cx=0,cy=0; p.forEach(q=>{cx+=q[0];cy+=q[1];}); cx/=p.length; cy/=p.length;
  const maxR=Math.max.apply(null,p.map(q=>Math.hypot(q[0]-cx,q[1]-cy)))||1;
  const segs=[];
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length];
    if(p.length<=7){
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      segs.push([[cx,cy],a,m],[[cx,cy],m,b]);
    }else segs.push([[cx,cy],a,b]);
  }
  let burst=150+it.type.mass*70;
  if(it.type.reflect) burst*=1.8;              // 镜子：碎片速度加成（反射连锁）
  for(const s of segs){
    let mx=0,my=0; s.forEach(q=>{mx+=q[0];my+=q[1];}); mx/=s.length; my/=s.length;
    const pts=s.map(q=>[q[0]*cos-q[1]*sin, q[0]*sin+q[1]*cos]);
    G.fragments.push({
      x:it.x, y:it.y, pts,
      vx:it.vx*0.7+(mx/maxR)*burst*rnd(0.5,1)+rnd(-70,70),
      vy:it.vy*0.7+(my/maxR)*burst*rnd(0.5,1)-burst*0.45+rnd(-50,50),
      ang:it.ang+rnd(-0.3,0.3), vang:rnd(-14,14),
      color:Math.random()<0.3?it.type.color2:shade(it.type.color,rnd(-0.12,0.08)),
      edge:it.type.edge, bounces:0, settled:false, hard:!!it.type.reflect,
    });
    if(G.fragments.length>150) G.fragments.shift();   // 碎片上限，对象池式回收
  }
}
function makeDust(it){
  for(let i=0;i<6;i++){
    G.dust.push({ x:it.x+rnd(-10,10), y:it.y+rnd(-6,6), vx:rnd(-60,60), vy:rnd(-80,-20), r:rnd(2,5), t:0 });
    if(G.dust.length>60) G.dust.shift();
  }
}
function floater(txt,x,y,gold,s){
  G.floaters.push({txt,x:x+rnd(-14,14),y,t:0,gold,s:s||1,a:1});
  if(G.floaters.length>40) G.floaters.shift();
}
function checkPass(){
  if(G.free||G.passed||G.state!=='play') return;   // 发泄屋无通关目标
  const need=G.panelCount===0?Math.ceil(G.total*PASS_RATE):G.total;  // 继续砸场后：全清才再次结算
  if(G.smashed>=need){ G.passed=true; G.state='won'; G.panelDelay=0.9; }
}
function starsFor(){ const pct=G.smashed/G.total; return pct>=1?3:(pct>=0.8?2:(pct>=PASS_RATE?1:0)); }
function bankScore(){   // 结算入档：只把比上次结算多出的部分写入总积分（防重复计入）
  const stars=starsFor();
  const award=G.score+(stars>=3?Math.round(G.score*0.5):0);
  const add=Math.max(0,award-G.banked);
  G.banked=award; G.lastAdd=add;
  if(add>0) Save.addScore(add);
  Save.setStars(G.level,stars);
  Save.data.best[G.level]=Math.max(Save.data.best[G.level]||0,award);
  Save.data.maxCombo=Math.max(Save.data.maxCombo||0,G.maxCombo);
  Save.save();
}

/* ================= 物理 ================= */
function heldUpdate(it, realDt){
  const tx=input.x+input.offX, ty=input.y+input.offY;
  const k=Math.min(1,realDt*14);
  it.x+=(tx-it.x)*k; it.y+=(ty-it.y)*k;
  it.ang+=(-0.12-it.ang)*Math.min(1,realDt*10);
  it.x=clamp(it.x,it.w/2,W-it.w/2);
  it.y=clamp(it.y,it.h/2,GROUND-it.h/2);
}
function step(dt, realDt){
  if(G.comboT>0){ G.comboT-=realDt; if(G.comboT<=0){ G.combo=0; G.comboT=0; } }
  if(G.slowmoT>0) G.slowmoT-=realDt;
  else if(G.timeScale<1) G.timeScale=Math.min(1,G.timeScale+realDt*2.2);
  if(G.state==='won'&&!G.panel&&!G.panelShown){
    const settled=G.items.every(it=>it.state!=='fly')&&G.items.every(it=>it.state!=='held');
    if(settled){ G.panelDelay-=realDt; if(G.panelDelay<=0){ G.panel=true; G.panelShown=true; G.panelT=0; G.panelCount++; bankScore(); AU.fanfare(); vib([30,50,30,70,90]); if(starsFor()>=3) confettiBurst(); } }   // M5：三星彩带；M6：结算震动
  }
  if(G.panel) G.panelT+=realDt;
  if(G.hintT>0) G.hintT-=realDt;
  if(G.free){                              // 发泄屋：存活物品少于 9 件就不断刷新
    G.items=G.items.filter(it=>it.state!=='gone');  // 碎片独立管理，无需保留失效物品
    G.freeSpawnT-=realDt;
    let alive=0;
    for(const it of G.items) if(it.state!=='gone') alive++;
    if(alive<9&&G.freeSpawnT<=0){ G.freeSpawnT=rnd(0.8,1.6); spawnFree(); }
  }
  // 物品物理
  for(const it of G.items){
    if(it.state==='held'){ heldUpdate(it,realDt); continue; }
    if(it.state!=='fly') continue;
    it.vy+=GRAV*dt;
    if(it.soft&&it.vy>300) it.vy=300;         // 发泄屋空投：限速下落
    it.x+=it.vx*dt; it.y+=it.vy*dt; it.ang+=it.vang*dt;
    const hh=it.h/2, hw=it.w/2;
    if(it.y+hh>GROUND){                       // 地面
      it.y=GROUND-hh;
      if(it.soft){ it.soft=false; it.vy=0; it.vx*=0.5; it.vang*=0.6; it.state='rest'; continue; }  // 软着陆不摔碎
      const imp=Math.abs(it.vy);              // 撞击强度（vy 向下为正，取绝对值）
      if(imp>150){
        it.vy=-Math.abs(it.vy)*0.35; it.vx*=0.72; it.vang*=0.6;   // 弹起
        if(imp>it.type.thresh) takeDamage(it,it.source);
        else if(imp>320){ if(it.type.unbreakable) AU.metalClang(clamp(imp/1500,0.4,1)); else AU.thud(0.5+Math.min(0.5,imp/1500)); }
      }else{
        it.vy=0; it.vx*=0.85; it.vang*=0.92;
        if(Math.abs(it.vx)<12&&Math.abs(it.vang)<0.4) it.state='rest';
      }
    }
    for(const tb of TABLES){                   // 落在桌面（与地面同规则）
      if(it.x>tb.x0+6&&it.x<tb.x1-6&&it.vy>0&&it.y+hh>tb.y&&it.y+hh<tb.y+34){
        it.y=tb.y-hh;
        if(it.soft){ it.soft=false; it.vy=0; it.vx*=0.5; it.vang*=0.6; it.state='rest'; continue; }  // 软着陆不摔碎
        const imp=Math.abs(it.vy);
        if(imp>it.type.thresh) takeDamage(it,it.source);
        else if(imp>150){
          it.vy=-Math.abs(it.vy)*0.35; it.vx*=0.7; it.vang*=0.6;
          if(imp>320){ if(it.type.unbreakable) AU.metalClang(clamp(imp/1500,0.4,1)); else AU.thud(0.5+Math.min(0.5,imp/1500)); }
        }else{
          it.vy=0; it.vx*=0.85; it.vang*=0.92;
          if(Math.abs(it.vx)<12&&Math.abs(it.vang)<0.4) it.state='rest';
        }
      }
    }
    if(it.x-hw<0){ it.x=hw; it.vx=Math.abs(it.vx)*0.35; it.vang*=0.6;
      if(Math.abs(it.vx)>it.type.thresh) takeDamage(it,it.source); }
    if(it.x+hw>W){ it.x=W-hw; it.vx=-Math.abs(it.vx)*0.35; it.vang*=0.6;
      if(Math.abs(it.vx)>it.type.thresh) takeDamage(it,it.source); }
  }
  // 飞行物品撞静止物品（多米诺）
  for(const it of G.items){
    if(it.state!=='fly') continue;
    for(const jt of G.items){
      if(jt.state!=='rest') continue;
      if(dist2(it.x,it.y,jt.x,jt.y)<(it.r+jt.r)*(it.r+jt.r)){
        if(it.soft){                        // 发泄屋空投：落在堆叠物上即停，不砸伤
          it.soft=false; it.vy=0; it.vx*=0.5; it.vang*=0.6; it.state='rest'; continue;
        }
        const rel=Math.hypot(it.vx,it.vy);
        if(rel>240){
          takeDamage(jt,it.source);
          if(rel>it.type.thresh) takeDamage(it,it.source);
          else{ it.vx*=-0.25; it.vy*=-0.25; }
        }
      }
    }
  }
  // 碎片
  for(const fr of G.fragments){
    if(fr.settled) continue;
    fr.vy+=GRAV*dt;
    fr.x+=fr.vx*dt; fr.y+=fr.vy*dt; fr.ang+=fr.vang*dt;
    if(fr.y>GROUND-2){                         // 地面弹跳
      fr.y=GROUND-2;
      if(Math.abs(fr.vy)>80){
        fr.vy*=fr.hard?-0.6:-0.45; fr.vx*=fr.hard?0.78:0.7; fr.vang*=0.6; fr.bounces++;
        if(fr.bounces<=(fr.hard?5:3)) AU.tick(fr.bounces);
      }else{
        fr.vy=0; fr.vx*=0.85; fr.vang*=0.85;
        if(Math.abs(fr.vx)<12&&fr.bounces>0) fr.settled=true;
      }
    }
    for(const tb of TABLES){                   // 落在桌面上
      if(fr.x>tb.x0&&fr.x<tb.x1&&fr.vy>0&&fr.y>tb.y-2&&fr.y<tb.y+34){
        fr.y=tb.y-2;
        if(Math.abs(fr.vy)>80){ fr.vy*=-0.4; fr.vx*=0.7; fr.bounces++; if(fr.bounces<=3) AU.tick(fr.bounces); }
        else{ fr.vy=0; fr.vx*=0.85; if(Math.abs(fr.vx)<12&&fr.bounces>0) fr.settled=true; }
      }
    }
    if(fr.x<3){ fr.x=3; fr.vx=Math.abs(fr.vx)*0.5; }
    if(fr.x>W-3){ fr.x=W-3; fr.vx=-Math.abs(fr.vx)*0.5; }
    if(!fr.settled&&Math.hypot(fr.vx,fr.vy)>240){   // 碎片连锁砸中物品
      for(const jt of G.items){
        if(jt.state!=='rest') continue;
        if(dist2(fr.x,fr.y,jt.x,jt.y)<(jt.r+4)*(jt.r+4)){
          if(jt.type.unbreakable){   // 砸中保险箱：碎片被弹回，保险箱被撞动
            fr.vx*=-0.6; fr.vy*=-0.45; fr.vang+=rnd(-2,2); AU.metalClang(0.6);
            jt.state='fly'; jt.vx=fr.vx*0.08; jt.vy=-rnd(40,120); jt.vang=rnd(-2,2);
            break;
          }
          takeDamage(jt,'chain'); fr.vx*=0.5; fr.vy*=0.5; break;
        }
      }
    }
  }
  // 粒子与飘字
  for(const p of G.dust){ p.t+=realDt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=60*dt; }
  G.dust=G.dust.filter(p=>p.t<1);
  for(const f of G.floaters){ f.t+=realDt; f.y-=55*realDt; f.a=1-f.t; }
  G.floaters=G.floaters.filter(f=>f.t<1);
  updateConfetti(realDt);              // M5：三星彩带下落
}

/* ================= 渲染 ================= */

function drawTrajectory(c){
  if(!input.held) return;
  const v=gestureVel(), sp=Math.hypot(v.x,v.y);
  let x=input.held.x, y=input.held.y, vx, vy;
  if(sp>280){ vx=clamp(v.x*1.15,-1500,1500); vy=clamp(v.y*1.15,-1500,1500); }
  else { vx=0; vy=50; }
  const dt=1/60;
  c.save();
  for(let i=0;i<26;i++){
    vy+=GRAV*dt; x+=vx*dt; y+=vy*dt;
    if(y>GROUND-6||x<8||x>W-8) break;
    if(i%3===0){
      c.globalAlpha=0.5*(1-i/26);
      c.fillStyle='#3a3a3a';
      c.beginPath(); c.arc(x,y,3,0,Math.PI*2); c.fill();
    }
  }
  c.restore();
}

function render(t){
  const c=ctx;
  c.clearRect(0,0,W,H);
  if(G.screen==='select') drawSelect(c,t);
  else if(G.screen==='shop') drawShop(c,t);
  else if(G.screen==='hall') drawHall(c,t);
  else if(G.screen==='titles') drawTitles(c,t);
  else if(G.screen==='settings') drawSettings(c,t);
  else{
    c.save();
    if(G.shakeAmp>0.2){                       // 震屏（实时衰减）
      G.shakeAmp*=Math.exp(-6*G.lastRealDt);
      c.translate(rnd(-G.shakeAmp,G.shakeAmp),rnd(-G.shakeAmp,G.shakeAmp));
    }else G.shakeAmp=0;
    drawRoom(c);
    drawShadows(c);
    for(const it of G.items){
      if(it.state==='gone'||it.state==='held') continue;
      drawItem(c,it);
    }
    drawFragments(c);
    drawDust(c);
    if(input.held) drawItem(c,input.held,1.12,true);
    drawTrajectory(c);
    drawFloaters(c);
    c.restore();
    drawHUD(c,t);
    drawVignette(c);
    if(G.hintT>0&&!G.panel) drawHint(c);
    if(G.panel) drawPanel(c);

    if(G.paused) drawPause(c);

    c.fillStyle='rgba(10,8,20,'+Math.min(1,G.fade/0.24)*0.92+')';

}

function startLevel(n){
  if(G.screen==='play'&&!G.free&&G.panelCount>0) bankScore();
  G.panelCount=0; // 旧关收益已保存，避免 resetLevel 按新关索引再次结算
  G.level=n; G.free=false; G.screen='play'; G.screenT=0; G.fade=0.24;   // M5：切屏淡入
  resetLevel();
}
function startFree(){  // 自由发泄屋：无尽刷分模式（第 3 关后解锁）
  if(G.screen==='play'&&!G.free&&G.panelCount>0) bankScore();
  G.panelCount=0;
  G.level=LEVELS.length; G.free=true; G.screen='play'; G.screenT=0; G.fade=0.24;
  resetLevel();
  for(let i=0;i<8;i++) spawnFree();   // 开场一波物品雨
}
function freeUnlocked(){ return Save.data.stars[2]>=1; }   // 通关第 3 关（1 星即可）解锁

function tryRedeem(i){                  // 兑换礼品：积分达标即可领取（不扣分），赠称号徽章
  const g=GIFTS[i];
  if(Save.hasGift(g.id)||Save.data.score<g.price){ AU.ui(); return; }
  Save.data.gifts.push(g.id); if(!Save.save()) return;
  AU.redeem();
  G.toast='🎁 已领取「'+g.name+'」 获得称号 '+g.title; G.toastT=3.2;
  vib([30,50,30,50,60]);
}
function showLevelSelect(){
  if(G.screen==='play'&&!G.free&&G.panelCount>0) bankScore(); // 通关后继续砸的新增收益退出也保留
  G.screen='select'; G.screenT=0; G.fade=0.24;   // M5：切屏淡入
  G.panel=false; G.free=false;
  G.paused=false; G.pauseBtn=null;applyAudio();
  input.active=false; input.held=null;
  G.items=[]; G.fragments=[]; G.dust=[]; G.floaters=[];
  G.shakeAmp=0; G.timeScale=1; G.slowmoT=0; G.freezeT=0;
}
function resetLevel(){
  if(G.screen==='play'&&!G.free&&G.panelCount>0) bankScore();
  G.items=makeItems();
  G.paused=false;G.pauseBtn=null;applyAudio();
  G.fragments=[]; G.dust=[]; G.floaters=[];
  G.score=0; G.scoreShow=0; G.combo=0; G.comboT=0; G.maxCombo=0;
  G.smashed=0;
  G.total=0;
  for(const it of G.items) if(!it.type.unbreakable) G.total++;   // 保险箱不计入通关目标
  G.passed=false; G.panel=false; G.panelShown=false; G.panelDelay=0; G.panelT=0;
  G.state='play'; G.freezeT=0; G.shakeAmp=0; G.timeScale=1; G.slowmoT=0;
  G.breakTimes=[]; G.hintT=8; G.panelCount=0; G.banked=0; G.lastAdd=0;
  G.freeSpawnT=0;
  G.retArm=false; G.retT=0;                // M6：退出确认复位
  input.active=false; input.held=null;
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let realDt=Math.min((now-last)/1000,1/30); last=now;
  G.lastRealDt=realDt;
  if(G.toastT>0) G.toastT-=realDt;          // 兑换提示计时
  if(G.fade>0) G.fade-=realDt;              // M5：切屏淡入遮罩
  if(G.screenT<10) G.screenT+=realDt;       // M5：入场动画时钟
  if(G.resetT>0){ G.resetT-=realDt; if(G.resetT<=0) G.resetArm=false; }   // M5：重置确认倒计时
  if(G.retT>0){ G.retT-=realDt; if(G.retT<=0) G.retArm=false; }           // M6：退出确认倒计时
  if(!G.paused&&!document.hidden&&!isLandscape()){
    if(G.freezeT>0) G.freezeT-=realDt;
    else if(G.screen==='play') step(realDt*G.timeScale, realDt);
  }
  render(now/1000);
}
requestAnimationFrame(frame);
